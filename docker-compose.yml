services:

  postgres:
    image: postgres:16
    container_name: ids-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ids_app
      POSTGRES_PASSWORD: ids_password
      POSTGRES_DB: idsdb


    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - ids-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ids_app -d idsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  ids-app:
    build: .
    container_name: ids-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      DB_USERNAME: ids_app
      DB_PASSWORD: ids_password
      DB_URL: jdbc:postgresql://postgres:5432/idsdb
      JWT_SECRET: ${JWT_SECRET}

    networks:
      - ids-network

volumes:
  postgres_data:

networks:
  ids-network:
    driver: bridge